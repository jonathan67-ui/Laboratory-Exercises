<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasty Table - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=5.0">
</head>
<body class="login-page d-flex justify-content-center align-items-center vh-100">

    <div class="card login-card">

        <div class="card-header login-header border-0 bg-transparent">
            <h1>🍽️ Tasty Table</h1>
        </div>

        <div class="card-body login-body">
            <form id="loginForm">

                <div class="mb-3 form-group-custom">
                    <label for="username" class="form-label">Username</label>
                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        required>
                </div>

                <div class="mb-3 form-group-custom">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        required>
                </div>

                <div id="loginAlert"></div>

                <button type="submit" class="btn btn-login w-100">
                    Login
                </button>

                <div class="signup-redirect">
                    Don't have an account? <a href="#">Sign up</a>
                </div>

            </form>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
